name: liftli plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plugin skill copies match skills/
        run: python3 scripts/build_liftli_plugin.py --check
      - name: Validate the marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.284 plugin validate . --strict
      - name: Validate the liftli plugin
        run: npx -y @anthropic-ai/claude-code@2.1.284 plugin validate ./plugins/liftli --strict
